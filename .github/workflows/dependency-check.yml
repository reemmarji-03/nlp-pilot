name: Dependency Check

on:
  push:
  pull_request:

jobs:
  pip-install:
    name: pip install and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest

  conda-install:
    name: conda environment solve and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: nlp-pilot
          cache-environment: true
          cache-downloads: true
      - name: Check dependency consistency
        shell: bash -el {0}
        run: python -m pip check
      - name: Install test dependency
        shell: bash -el {0}
        run: python -m pip install "pytest>=8,<10"
      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest
